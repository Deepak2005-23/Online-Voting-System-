spring.application.name=online-voting-backend

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/online_voting_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
# 256-bit+ secret, base64 or plain string (change this in production!)
jwt.secret=ThisIsASecretKeyForJWTTokenGenerationChangeItInProduction123456
jwt.expiration.ms=86400000
